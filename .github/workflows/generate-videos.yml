name: Generate talking-head videos

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: Image path in input-image-audio/
        type: string
        required: true
        default: input-image-audio/image_026443.png
      audio_file:
        description: MP3 audio path in input-image-audio/
        type: string
        required: true
        default: input-image-audio/scene-04_rudregowda.mp3
  push:
    paths:
      - "input-image-audio/**"

permissions:
  contents: read
  packages: read

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container:
      image: ghcr.io/prakashdeepika/sadtalker-cpu:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate inputs and generate one video per image
        shell: bash
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
          AUDIO_FILE: ${{ inputs.audio_file }}
        run: |
          set -euo pipefail
          audio="${AUDIO_FILE:-input-image-audio/scene-04_rudregowda.mp3}"
          if [[ "$audio" != input-image-audio/* || "$audio" == *".."* || "${audio,,}" != *.mp3 ]]; then
            echo "::error::Audio must be an MP3 path inside input-image-audio/."
            exit 1
          fi
          if [[ ! -f "$audio" ]]; then
            echo "::error::Missing shared audio file: $audio"
            exit 1
          fi

          mkdir -p work
          normalized_audio="work/voiceover-16k-mono.wav"
          ffmpeg -hide_banner -loglevel error -y \
            -i "$audio" -vn -ac 1 -ar 16000 -c:a pcm_s16le "$normalized_audio"
          if [[ ! -s "$normalized_audio" ]]; then
            echo "::error::Could not decode the MP3 audio file: $audio"
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            image="$SOURCE_IMAGE"
            if [[ "$image" != input-image-audio/* || "$image" == *".."* ]]; then
              echo "::error::Source image must be a path inside input-image-audio/."
              exit 1
            fi
            case "${image,,}" in
              *.png|*.jpg|*.jpeg|*.webp) ;;
              *)
                echo "::error::Unsupported image. Use PNG, JPG, JPEG, or WEBP."
                exit 1
                ;;
            esac
            if [[ ! -f "$image" ]]; then
              echo "::error::Source image not found: $image"
              exit 1
            fi
            images=("$image")
          else
            mapfile -d '' images < <(
              find input-image-audio -maxdepth 1 -type f \
                \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) \
                -print0 | sort -z
            )
          fi
          if (( ${#images[@]} == 0 )); then
            echo "::error::No images found in input-image-audio (supported: PNG, JPG, JPEG, WEBP)."
            exit 1
          fi

          ln -s /opt/sadtalker/gfpgan gfpgan
          mkdir -p results
          for index in "${!images[@]}"; do
            image="${images[$index]}"
            filename="$(basename "$image")"
            name="${filename%.*}"
            output="$(printf 'results/%03d_%s.mp4' "$((index + 1))" "$name")"
            intermediate="$(printf 'work/%03d_%s_sadtalker.mp4' "$((index + 1))" "$name")"
            echo "Generating $output from $filename"
            python scripts/generate_video.py \
              --source-image "$image" \
              --audio "$normalized_audio" \
              --output "$intermediate" \
              --checkpoint-dir /opt/sadtalker/checkpoints \
              --preprocess full \
              --size 512 \
              --enhancer gfpgan \
              --expression-scale 1.2 \
              --cpu

            ffmpeg -hide_banner -loglevel error -y \
              -i "$intermediate" -i "$audio" \
              -map 0:v:0 -map 1:a:0 \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1" \
              -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -r 25 \
              -c:a aac -b:a 192k -shortest -movflags +faststart \
              "$output"

            dimensions="$(ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height -of csv=s=x:p=0 "$output")"
            if [[ "$dimensions" != "1920x1080" ]]; then
              echo "::error::Expected 1920x1080 output, got $dimensions for $output"
              exit 1
            fi
            if ! ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name -of csv=p=0 "$output" | grep -q .; then
              echo "::error::No audio stream found in $output"
              exit 1
            fi
          done

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: sadtalker-videos
          path: results/*.mp4
          if-no-files-found: error
          retention-days: 7
