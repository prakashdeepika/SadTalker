name: Generate talking-head videos

on:
  workflow_dispatch:
  push:
    paths:
      - "input-image-audio/**"
      - ".github/workflows/generate-videos.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libgl1

      - name: Install CPU PyTorch and SadTalker dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install \
            torch==1.12.1+cpu \
            torchvision==0.13.1+cpu \
            torchaudio==0.12.1 \
            --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Download SadTalker checkpoints
        run: |
          mkdir -p checkpoints
          curl --fail --location --retry 3 \
            https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc/mapping_00109-model.pth.tar \
            --output checkpoints/mapping_00109-model.pth.tar
          curl --fail --location --retry 3 \
            https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc/SadTalker_V0.0.2_512.safetensors \
            --output checkpoints/SadTalker_V0.0.2_512.safetensors

      - name: Download GFPGAN face enhancement weights
        run: |
          mkdir -p gfpgan/weights
          curl --fail --location --retry 3 \
            https://github.com/xinntao/facexlib/releases/download/v0.1.0/alignment_WFLW_4HG.pth \
            --output gfpgan/weights/alignment_WFLW_4HG.pth
          curl --fail --location --retry 3 \
            https://github.com/xinntao/facexlib/releases/download/v0.1.0/detection_Resnet50_Final.pth \
            --output gfpgan/weights/detection_Resnet50_Final.pth
          curl --fail --location --retry 3 \
            https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth \
            --output gfpgan/weights/GFPGANv1.4.pth
          curl --fail --location --retry 3 \
            https://github.com/xinntao/facexlib/releases/download/v0.2.2/parsing_parsenet.pth \
            --output gfpgan/weights/parsing_parsenet.pth

      - name: Validate inputs and generate one video per image
        shell: bash
        run: |
          set -euo pipefail
          audio="input-image-audio/scene-04_rudregowda.mp3"
          if [[ ! -f "$audio" ]]; then
            echo "::error::Missing shared audio file: $audio"
            exit 1
          fi

          mkdir -p work
          normalized_audio="work/voiceover-16k-mono.wav"
          ffmpeg -hide_banner -loglevel error -y \
            -i "$audio" -vn -ac 1 -ar 16000 -c:a pcm_s16le "$normalized_audio"
          if [[ ! -s "$normalized_audio" ]]; then
            echo "::error::Could not decode the MP3 audio file: $audio"
            exit 1
          fi

          mapfile -d '' images < <(
            find input-image-audio -maxdepth 1 -type f \
              \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) \
              -print0 | sort -z
          )
          if (( ${#images[@]} == 0 )); then
            echo "::error::No images found in input-image-audio (supported: PNG, JPG, JPEG, WEBP)."
            exit 1
          fi

          mkdir -p results
          for index in "${!images[@]}"; do
            image="${images[$index]}"
            filename="$(basename "$image")"
            name="${filename%.*}"
            output="$(printf 'results/%03d_%s.mp4' "$((index + 1))" "$name")"
            intermediate="$(printf 'work/%03d_%s_sadtalker.mp4' "$((index + 1))" "$name")"
            echo "Generating $output from $filename"
            python scripts/generate_video.py \
              --source-image "$image" \
              --audio "$normalized_audio" \
              --output "$intermediate" \
              --checkpoint-dir checkpoints \
              --preprocess full \
              --size 512 \
              --enhancer gfpgan \
              --expression-scale 1.2 \
              --cpu

            ffmpeg -hide_banner -loglevel error -y \
              -i "$intermediate" -i "$audio" \
              -map 0:v:0 -map 1:a:0 \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1" \
              -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -r 25 \
              -c:a aac -b:a 192k -shortest -movflags +faststart \
              "$output"

            dimensions="$(ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height -of csv=s=x:p=0 "$output")"
            if [[ "$dimensions" != "1920x1080" ]]; then
              echo "::error::Expected 1920x1080 output, got $dimensions for $output"
              exit 1
            fi
            if ! ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name -of csv=p=0 "$output" | grep -q .; then
              echo "::error::No audio stream found in $output"
              exit 1
            fi
          done

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: sadtalker-videos
          path: results/*.mp4
          if-no-files-found: error
          retention-days: 7
